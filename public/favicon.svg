<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="BMR APPS">
  <title>BMR APPS</title>
  <!-- BMR APPS 파비콘: 2px 검은 테두리 · 각진 면 · 시안(#0abbee)과 노랑(#ffdc1a) — 허브 화면과 같은 결 -->
  <rect width="32" height="32" fill="#0abbee"/>
  <rect x="0" y="24" width="32" height="8" fill="#ffdc1a"/>
  <g fill="#000">
    <rect x="8" y="5" width="5" height="18"/>
    <rect x="13" y="5" width="9" height="4"/>
    <rect x="18" y="9" width="4" height="3"/>
    <rect x="13" y="12" width="8" height="4"/>
    <rect x="18" y="16" width="4" height="3"/>
    <rect x="13" y="19" width="9" height="4"/>
  </g>
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#000" stroke-width="2"/>
</svg>
